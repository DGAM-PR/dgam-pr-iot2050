# DHCP-only service for the PLC-facing device's bottom X1 P1 port.
port=0
interface=eno1
except-interface=eno2
bind-dynamic

dhcp-authoritative
dhcp-range=192.168.200.5,192.168.200.254,255.255.255.0,12h

# This isolated PLC link provides neither a default route nor DNS.
dhcp-option=option:router
dhcp-option=option:dns-server
